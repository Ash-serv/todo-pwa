<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List PWA</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS for Excel processing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Link to manifest for PWA with cache-busting query -->
  <link rel="manifest" href="/todo-pwa/manifest.json?v=4">
  <!-- Theme color for PWA -->
  <meta name="theme-color" content="#3B82F6">
</head>
<body class="bg-gray-100 font-sans">
  <div class="container mx-auto p-4 max-w-lg">
    <h1 class="text-3xl font-bold text-center mb-2 text-gray-800">To-Do List</h1>
    <!-- Version display -->
    <p id="version" class="text-center text-sm text-gray-600 mb-4">Version 4</p>
    
    <!-- Input Form -->
    <div class="flex flex-col space-y-2 mb-4">
      <input 
        id="taskInput" 
        type="text" 
        placeholder="Enter a task" 
        class="p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
      <select id="categorySelect" class="p-2 border border-gray-300 rounded-lg">
        <option value="Work">Work</option>
        <option value="Personal">Personal</option>
        <option value="Other">Other</option>
      </select>
      <label class="flex items-center space-x-2">
        <input 
          id="addDueDateCheckbox" 
          type="checkbox" 
          class="h-5 w-5 text-blue-500 focus:ring-blue-500 border-gray-300 rounded"
          onchange="toggleDueDateInput()"
        >
        <span class="text-gray-700">Add Due Date</span>
      </label>
      <input 
        id="dueDateInput" 
        type="datetime-local" 
        class="hidden p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
      <button 
        onclick="addTask()" 
        class="bg-blue-500 text-white p-2 rounded-lg hover:bg-blue-600"
      >
        Add Task
      </button>
    </div>

    <!-- Task List -->
    <ul id="taskList" class="space-y-2"></ul>
  </div>

  <script type="text/javascript">
    // Excel processing script (unchanged)
    var gk_isXlsx = false;
    var gk_xlsxFileLookup = {};
    var gk_fileData = {};
    function filledCell(cell) {
      return cell !== '' && cell != null;
    }
    function loadFileData(filename) {
      if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
        try {
          var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
          var firstSheetName = workbook.SheetNames[0];
          var worksheet = workbook.Sheets[firstSheetName];
          var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
          var filteredData = jsonData.filter(row => row.some(filledCell));
          var headerRowIndex = filteredData.findIndex((row, index) =>
            row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
          );
          if (headerRowIndex === -1 || headerRowIndex > 25) {
            headerRowIndex = 0;
          }
          var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex));
          csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
          return csv;
        } catch (e) {
          console.error('Excel processing error:', e);
          return "";
        }
      }
      return gk_fileData[filename] || "";
    }
  </script>

    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

    // Format date for display in local timezone
    function formatDate(dateString) {
      if (!dateString) return 'No due date';
      const date = new Date(dateString);
      if (isNaN(date.getTime())) {
        console.warn('Invalid date:', dateString);
        return 'Invalid date';
      }
      console.log('Raw date:', dateString, 'Formatted:', date.toLocaleString());
      return date.toLocaleString('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      }); // Use local timezone
    }

    // Check if a due date is overdue
    function isOverdue(dueDate) {
      if (!dueDate) return false;
      const dueDateTime = new Date(dueDate).getTime();
      if (isNaN(dueDateTime)) {
        console.warn('Invalid due date for overdue check:', dueDate);
        return false;
      }
      return dueDateTime < Date.now();
    }

      if (!checkbox.checked) {
        dueDateInput.value = ''; // Clear input when hidden
      }
    }
